<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css">
  <title>REST и MockAPI</title>
</head>
<body>
  <div class="wrapper">
    <div class="controls">
      <select id="completed">
        <option value="">Все</option>
        <option value="true">Выполненные</option>
        <option value="false">Невыполненные</option>
      </select>
      <input id="search" placeholder="Поиск">
      <select id="sortBy">
        <option value="">Без сортировки</option>
        <option value="title">По названию</option>
      </select>
      <select id="order">
        <option value="asc">По возрастанию</option>
        <option value="desc">По убыванию</option>
      </select>
      <input id="limit" type="number" min="1" value="5">
    </div>

    <p class="url"></p>

    <form>
      <input name="title" placeholder="Новая задача" required>
      <button type="submit">Добавить</button>
    </form>

    <ul class="tasks"></ul>
    <button class="load-more" hidden>Загрузить ещё</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
